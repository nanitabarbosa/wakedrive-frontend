<div class="change-password-dialog">
  <app-modal-header title="Cambiar contraseña" icon="lock" variant="primary" (closed)="close()" />
  <span class="auth-card__description">Debe tener al menos 8 caracteres e incluir letras y números.</span>
  <app-change-password-form [cancellable]="true" (changed)="close()" (cancelled)="close()" />
</div>
