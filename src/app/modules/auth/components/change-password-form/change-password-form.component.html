<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="form-field">
    <label for="change-current">Contraseña actual</label>
    <div class="input-icon" [class.is-invalid]="hasError('currentPassword')">
      <mat-icon class="input-icon__icon">lock_outline</mat-icon>
      <input
        id="change-current"
        [type]="showCurrent() ? 'text' : 'password'"
        formControlName="currentPassword"
        placeholder="Ingresa tu contraseña actual"
        autocomplete="new-password"
        maxlength="64"
      />
      <button
        type="button"
        class="input-icon__toggle"
        (click)="toggleCurrent()"
        [attr.aria-label]="showCurrent() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        <mat-icon>{{ showCurrent() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
    </div>
    @if (hasError('currentPassword')) {
      <span class="form-field__error">{{ errorFor('currentPassword') }}</span>
    }
  </div>
  <div class="form-field">
    <label for="change-new">Nueva contraseña</label>
    <div class="input-icon" [class.is-invalid]="hasError('newPassword')">
      <mat-icon class="input-icon__icon">lock_outline</mat-icon>
      <input
        id="change-new"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="newPassword"
        placeholder="Ingresa tu nueva contraseña"
        autocomplete="new-password"
        maxlength="64"
      />
      <button
        type="button"
        class="input-icon__toggle"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        <mat-icon>{{ showPassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
    </div>
    @if (hasError('newPassword')) {
      <span class="form-field__error">{{ errorFor('newPassword') }}</span>
    }
  </div>
  <div class="form-field">
    <label for="change-confirm">Confirmar contraseña</label>
    <div class="input-icon" [class.is-invalid]="hasError('confirmPassword')">
      <mat-icon class="input-icon__icon">lock_outline</mat-icon>
      <input
        id="change-confirm"
        [type]="showConfirm() ? 'text' : 'password'"
        formControlName="confirmPassword"
        placeholder="Repite tu nueva contraseña"
        autocomplete="new-password"
        maxlength="64"
      />
      <button
        type="button"
        class="input-icon__toggle"
        (click)="toggleConfirm()"
        [attr.aria-label]="showConfirm() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        <mat-icon>{{ showConfirm() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
    </div>
    @if (hasError('confirmPassword')) {
      <span class="form-field__error">{{ errorFor('confirmPassword') }}</span>
    }
  </div>
  @if (cancellable) {
    <div class="auth-form__actions">
      <button type="button" class="btn btn--outline" (click)="cancelled.emit()">Cancelar</button>
      <button type="submit" class="btn btn--primary" [disabled]="loading()">{{ loading() ? 'Guardando...' : 'Guardar contraseña' }}</button>
    </div>
  } @else {
    <button type="submit" class="btn btn--primary auth-form__submit" [disabled]="loading()">
      {{ loading() ? 'Guardando...' : 'Guardar contraseña' }}
      <mat-icon>arrow_forward</mat-icon>
    </button>
  }
</form>
