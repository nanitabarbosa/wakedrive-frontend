<section class="auth-page">
  <div class="auth-page__content">
    <div class="auth-hero">
      <img class="auth-hero__logo" src="images/logo-horizontal.png" alt="WakeDrive" />
      <span class="auth-hero__divider"></span>
      <span class="auth-hero__title">
        <span class="auth-hero__title-line">Conducción segura,</span>
        <span class="auth-hero__title-line auth-hero__title-line--accent">más vidas en el camino</span>
      </span>
      <span class="auth-hero__subtitle">Tecnología para monitorear, detectar y prevenir la somnolencia en tiempo real.</span>
    </div>
    <div class="auth-card">
      <span class="auth-card__title">Cambia tu contraseña</span>
      <span class="auth-card__description">Es tu primer ingreso. Por seguridad, crea una contraseña nueva antes de continuar. Debe tener al menos 8 caracteres e incluir letras y números.</span>
      <app-change-password-form (changed)="onChanged()" />
      <button type="button" class="auth-back" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    </div>
  </div>
</section>
