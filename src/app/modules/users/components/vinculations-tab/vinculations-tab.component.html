<app-table
  [columns]="columns"
  [data]="vinculations()"
  [customColumns]="['index', 'userName', 'vehiclePlate', 'linkedAt', 'actions']"
  [showToolbar]="true"
  [paginated]="true"
  [page]="page()"
  [pageSize]="pageSize"
  [total]="total()"
  (pageChange)="onPageChange($event)"
  [emptyMessage]="loadError() ? 'No se pudieron cargar las vinculaciones. Intenta de nuevo más tarde.' : 'No hay vinculaciones que coincidan con la búsqueda.'"
>
  <div class="toolbar" table-actions>
    <div class="toolbar__row">
      <label class="search">
        <mat-icon>search</mat-icon>
        <input type="search" placeholder="Buscar por conductor, placa o serial..." (input)="onSearch($any($event.target).value)" />
      </label>
      <button type="button" class="btn btn--primary btn--sm" (click)="openDrawer()">
        <mat-icon>add_link</mat-icon>Nueva vinculación
      </button>
    </div>
  </div>
  <ng-template #cellTemplate let-item let-column="column" let-index="index">
    @switch (column.key) {
      @case ('index') {
        <span class="text-strong">{{ rowNumber(index) }}</span>
      }
      @case ('userName') {
        <span class="user-cell">
          <span class="avatar avatar--lg" [style.background]="avatarColors[item.userId % avatarColors.length]">{{ item.userName | initials }}</span>
          {{ item.userName }}
        </span>
      }
      @case ('vehiclePlate') {
        <span class="plate">{{ item.vehiclePlate }}</span>
      }
      @case ('linkedAt') {
        {{ item.linkedAt | date: 'dd/MM/yyyy' }}
      }
      @case ('actions') {
        <span class="row-actions">
          <button type="button" class="row-actions__btn row-actions__btn--danger" (click)="confirmUnlink(item)" aria-label="Desvincular" title="Desvincular">
            <mat-icon>link_off</mat-icon>
          </button>
        </span>
      }
    }
  </ng-template>
</app-table>
<app-vinculation-drawer [open]="drawerOpen()" (closed)="closeDrawer()" (saved)="onSaved($event)" />
