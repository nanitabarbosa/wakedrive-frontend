<app-drawer [title]="title" icon="memory" variant="purple" [open]="open" (closed)="closed.emit()">
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="form-section">
      <span class="form-section__title"><mat-icon>memory</mat-icon>Información del dispositivo</span>
      <div class="form-field">
        <label for="device-serial">Serial <span class="required">*</span></label>
        <input id="device-serial" formControlName="serial" placeholder="Ej. WD-000123" maxlength="50" class="uppercase" [class.is-invalid]="hasError('serial')" />
        @if (hasError('serial')) {
          <span class="form-field__error">{{ errorFor('serial') }}</span>
        }
      </div>
      @if (mode !== 'create') {
        <div class="form-field">
          <label for="device-status">Estado <span class="required">*</span></label>
          <ng-select formControlName="status" [items]="statusOptions" bindLabel="1" bindValue="0" [clearable]="false" [searchable]="false" inputId="device-status" />
        </div>
      }
    </div>
  </form>
  @if (mode !== 'view') {
    <app-form-actions
      drawer-footer
      [saveLabel]="mode === 'edit' ? 'Guardar cambios' : 'Guardar dispositivo'"
      [loading]="saving()"
      (save)="save()"
      (dismiss)="closed.emit()"
    />
  }
</app-drawer>
