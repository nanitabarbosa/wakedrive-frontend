<app-table
  [columns]="columns"
  [data]="vehicles()"
  [customColumns]="['index', 'plate', 'type', 'status', 'actions']"
  [showToolbar]="true"
  [selectable]="true"
  [paginated]="true"
  [page]="page()"
  [pageSize]="pageSize"
  [total]="total()"
  (pageChange)="onPageChange($event)"
  [emptyMessage]="loadError() ? 'No se pudieron cargar los vehículos. Intenta de nuevo más tarde.' : 'No hay vehículos que coincidan con la búsqueda.'"
>
  <div class="toolbar" table-actions>
    <div class="toolbar__row">
      <label class="search">
        <mat-icon>search</mat-icon>
        <input type="search" placeholder="Buscar por placa, marca o modelo..." (input)="onSearch($any($event.target).value)" />
      </label>
      <button type="button" class="btn btn--primary btn--sm" (click)="openDrawer('create')">
        <mat-icon>add</mat-icon>Nuevo vehículo
      </button>
    </div>
    <div class="toolbar__row">
      <select class="select" [value]="type()" (change)="onTypeChange($any($event.target).value)" aria-label="Filtrar por tipo">
        <option value="">Todos los tipos</option>
        @for (option of typeOptions; track option[0]) {
          <option [value]="option[0]">{{ option[1] }}</option>
        }
      </select>
      <select class="select" [value]="status()" (change)="onStatusChange($any($event.target).value)" aria-label="Filtrar por estado">
        <option value="">Todos los estados</option>
        @for (option of statusOptions; track option[0]) {
          <option [value]="option[0]">{{ option[1] }}</option>
        }
      </select>
    </div>
  </div>
  <ng-template #cellTemplate let-vehicle let-column="column" let-index="index">
    @switch (column.key) {
      @case ('index') {
        <span class="text-strong">{{ rowNumber(index) }}</span>
      }
      @case ('plate') {
        <span class="plate">{{ vehicle.plate }}</span>
      }
      @case ('type') {
        <span class="chip">{{ typeLabels[vehicle.type] }}</span>
      }
      @case ('status') {
        <span class="badge" [class.badge--success]="vehicle.status === 'ACTIVE'" [class.badge--danger]="vehicle.status === 'INACTIVE'">
          {{ statusLabels[vehicle.status] }}
        </span>
      }
      @case ('actions') {
        <span class="row-actions">
          <button type="button" class="row-actions__btn" (click)="openDrawer('view', vehicle)" aria-label="Ver vehículo" title="Ver">
            <mat-icon>visibility</mat-icon>
          </button>
          <button type="button" class="row-actions__btn" (click)="openDrawer('edit', vehicle)" aria-label="Editar vehículo" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button type="button" class="row-actions__btn row-actions__btn--danger" (click)="confirmDelete(vehicle)" aria-label="Eliminar vehículo" title="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </span>
      }
    }
  </ng-template>
</app-table>
<app-vehicle-drawer [open]="drawerOpen()" [mode]="drawerMode()" [vehicle]="selectedVehicle()" (closed)="closeDrawer()" (saved)="onSaved($event)" />
