<section class="wrapper-section">
  <app-page-header title="Dispositivos" subtitle="Consulta el estado y la última conexión de los dispositivos de tu empresa." />
  <app-table
    [columns]="columns"
    [data]="devices()"
    [customColumns]="['index', 'serial', 'status', 'lastConnection']"
    [showToolbar]="true"
    [paginated]="true"
    [page]="page()"
    [pageSize]="pageSize"
    [total]="total()"
    (pageChange)="onPageChange($event)"
    [emptyMessage]="loadError() ? 'No se pudieron cargar los dispositivos. Intenta de nuevo más tarde.' : 'No hay dispositivos que coincidan con la búsqueda.'"
  >
    <div class="toolbar" table-actions>
      <div class="toolbar__row">
        <label class="search">
          <mat-icon>search</mat-icon>
          <input type="search" placeholder="Buscar por serial, placa o usuario..." (input)="onSearch($any($event.target).value)" />
        </label>
      </div>
      <div class="toolbar__row">
        <ng-select class="ng-select--filter" [items]="statusOptions" bindLabel="1" bindValue="0" placeholder="Todos los estados" [searchable]="false" [ngModel]="status() || null" (ngModelChange)="onStatusChange($event ?? '')" aria-label="Filtrar por estado" />
      </div>
    </div>
    <ng-template #cellTemplate let-device let-column="column" let-index="index">
      @switch (column.key) {
        @case ('index') {
          <span class="text-strong">{{ rowNumber(index) }}</span>
        }
        @case ('serial') {
          <span class="plate">{{ device.serial }}</span>
        }
        @case ('status') {
          <span class="badge" [class.badge--success]="device.status === 'ACTIVE'" [class.badge--danger]="device.status === 'OFFLINE'">
            {{ statusLabels[device.status] }}
          </span>
        }
        @case ('lastConnection') {
          {{ device.lastConnection | timeAgo }}
        }
      }
    </ng-template>
  </app-table>
</section>
