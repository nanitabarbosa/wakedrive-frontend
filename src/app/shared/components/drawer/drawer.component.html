@if (open) {
  <div class="drawer-backdrop" (click)="close()"></div>
  <section class="drawer" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <app-modal-header [title]="title" [icon]="icon" [variant]="variant" (closed)="close()" />
    <div class="drawer__body"><ng-content /></div>
    <div class="drawer__footer"><ng-content select="[drawer-footer]" /></div>
  </section>
}
