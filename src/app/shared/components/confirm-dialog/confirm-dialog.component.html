<div class="confirm-dialog">
  <span class="confirm-dialog__icon"><mat-icon>warning</mat-icon></span>
  <span class="confirm-dialog__title">{{ data.title }}</span>
  <span class="confirm-dialog__message">{{ data.message }}</span>
  <div class="confirm-dialog__actions">
    <button type="button" class="btn btn--outline" (click)="close(false)">Cancelar</button>
    <button type="button" class="btn btn--danger" (click)="close(true)">{{ data.confirmLabel || 'Eliminar' }}</button>
  </div>
</div>
